worker_processes auto;
events { worker_connections 1024; }

http {
    # 127.0.0.1 and ::1 are different sites from localhost. Dev tooling
    # follows the host in the address bar (cookies and copied links split).
    # Keep the published port from Host: nginx listens on 80 here, while a
    # slot is published as 8081 or similar.
    map $http_host $loopback_canonical_host {
        default "";
        ~^127\.0\.0\.1:(\d+)$ localhost:$1;
        ~^127\.0\.0\.1$ localhost;
        ~^\[::1\]:(\d+)$ localhost:$1;
        ~^\[::1\]$ localhost;
    }

    server {
        if ($loopback_canonical_host != "") {
            return 308 $scheme://$loopback_canonical_host$request_uri;
        }

        listen 80;
        access_log off;

        # Static assets collected to backend/.output/static (chief-static nginx).
        location /static {
            proxy_pass http://chief-static:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable caching in dev so collectstatic changes show up immediately.
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # SSE endpoints must not be buffered by nginx.
        location ~ ^/(events|debug/sse-spike|sessions/[^/]+/events)/ {
            proxy_pass http://chief-backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # Everything else goes to Django (dashboard, admin, health, API).
        location / {
            proxy_pass http://chief-backend:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
